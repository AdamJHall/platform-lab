# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  install:
    desc: Install dependencies and pre-commit git hook
    cmds:
      - mise install
      - pre-commit install

  lint:
    desc: Run all workflow linting checks
    deps: [yamllint, actionlint, zizmor]

  yamllint:
    desc: Lint YAML files
    cmds:
      - yamllint .

  actionlint:
    desc: Lint GitHub Actions workflow files
    cmds:
      - actionlint

  zizmor:
    desc: Run security analysis on GitHub Actions workflows
    cmds:
      - zizmor .github/

  zizmor-fix:
    desc: Auto-fix zizmor security findings (safe fixes only)
    cmds:
      - zizmor --fix .github/

  tf:clean:
    desc: Remove local Terraform and Terragrunt caches
    cmds:
      - find . -type d -name '.terraform' -exec rm -rf {} +
      - find . -type d -name '.terragrunt-cache' -exec rm -rf {} +
      - find . -type d -name '.terragrunt-stack' -exec rm -rf {} +
      - find . -name '.terraform.lock.hcl' -delete

  tf:fmt:
    desc: Format all Terraform files
    cmds:
      - tofu fmt -recursive terraform/

  tf:validate:
    desc: Validate all catalog modules
    cmds:
      - |
        find terraform/catalog/modules -mindepth 1 -maxdepth 1 -type d | while read -r dir; do
          echo "--- Validating $dir ---"
          tofu -chdir="$dir" init -backend=false
          tofu -chdir="$dir" validate
        done

  tf:plan:*:
    desc: Plan all units in an environment (e.g. task plan:dev)
    vars:
      ENV: '{{index .MATCH 0}}'
    dir: terraform/environments/{{.ENV}}
    cmds:
      - terragrunt run --all plan

  tf:apply:*:
    desc: Apply all units in an environment (e.g. task apply:dev)
    vars:
      ENV: '{{index .MATCH 0}}'
    dir: terraform/environments/{{.ENV}}
    cmds:
      - terragrunt run --all apply

  tf:destroy:*:
    desc: Destroy all units in an environment (e.g. task destroy:dev)
    vars:
      ENV: '{{index .MATCH 0}}'
    dir: terraform/environments/{{.ENV}}
    cmds:
      - terragrunt run --all destroy
