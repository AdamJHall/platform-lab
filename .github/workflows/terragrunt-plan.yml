name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'

# Cancel in-progress plan run for the same PR
concurrency:
  group: tf-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect-changes:
    name: Detect changed environments
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environments: ${{ steps.detect.outputs.environments }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed environments
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")

          # A module change can affect every environment,
          # so plan them all. Otherwise, only plan environments with direct changes.
          if echo "$CHANGED" | grep -q '^terraform/modules/'; then
            ENVS=$(find terraform/environments \
              -maxdepth 1 -mindepth 1 -type d \
              -printf '%f\n' | sort \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          else
            ENVS=$(echo "$CHANGED" \
              | grep '^terraform/environments/' \
              | sed 's|terraform/environments/\([^/]*\)/.*|\1|' \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          fi

          echo "environments=$ENVS" >> "$GITHUB_OUTPUT"
          echo "Changed environments: $ENVS"

  plan:
    name: Plan (${{ matrix.environment }})
    needs: detect-changes
    if: needs.detect-changes.outputs.environments != '[]' && needs.detect-changes.outputs.environments != ''
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.detect-changes.outputs.environments) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terragrunt Plan
        id: plan
        uses: gruntwork-io/terragrunt-action@4ed5b7344c80315e5357f28f36159fc980bc2d5a # v3.4.0
        with:
          tg_dir: ${{ vars.ENVIRONMENT_DIR }}
          tg_command: run --all plan -- -no-color -input=false

      - name: Post plan comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: always()
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.tg_action_output }}
          ENVIRONMENT: ${{ matrix.environment }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const raw = (process.env.PLAN_OUTPUT || '').replace(/%0A/g, '\n');
            const maxLen = 60000;
            const output = raw.length > maxLen
              ? raw.slice(0, maxLen) + '\n\n> Output truncated — see full log in Actions.'
              : raw;

            const header = `## Plan: \`${process.env.ENVIRONMENT}\``;
            const status = process.env.PLAN_OUTCOME === 'success' ? '✅' : '❌';

            // Remove any previous plan comment for this environment so the PR
            // stays uncluttered when the branch is updated.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              if (c.user.type === 'Bot' && c.body.startsWith(header)) {
                await github.rest.issues.deleteComment({ ...context.repo, comment_id: c.id });
              }
            }

            const body = [
              `${header} ${status}`,
              '',
              '<details>',
              '<summary>Plan output</summary>',
              '',
              '```',
              output,
              '```',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
