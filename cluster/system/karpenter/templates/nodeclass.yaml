apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # al2023@latest is architecture-aware — Karpenter selects amd64 or arm64 AMI per instance type
  amiSelectorTerms:
    - alias: al2023@latest

  role: {{ .Values.role }}

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.discoveryTag }}

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.discoveryTag }}
