apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-git
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/AdamJHall/platform-lab.git
              revision: feature/cluster-setup
              directories:
                - path: cluster/apps/*
                - path: cluster/monitoring/*
                - path: cluster/platform/*
                - path: cluster/system/*
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: '{{.path.basename}}-{{.name}}'
    spec:
      project: '{{index .metadata.labels "environment"}}'
      source:
        repoURL: https://github.com/AdamJHall/platform-lab.git
        targetRevision: feature/cluster-setup
        path: '{{.path.path}}'
        helm:
          valueFiles:
            - values.yaml
            - values.{{index .metadata.labels "environment"}}.yaml
      syncPolicy:
        automated:
          prune: true
          allowEmpty: true
          selfHeal: true
      destination:
        server: '{{.server}}'
        namespace: '{{.path.basename}}'
