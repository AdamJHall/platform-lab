repos:
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [yaml]

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        pass_filenames: false
        files: ^\.github/workflows/

      - id: zizmor
        name: zizmor
        entry: zizmor .github/
        language: system
        pass_filenames: false
        files: ^\.github/workflows/

      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt -check -recursive terraform/
        language: system
        pass_filenames: false
        files: \.tf$

      - id: tofu-validate
        name: tofu validate
        entry: bash -c 'find terraform/modules -mindepth 1 -maxdepth 1 -type d | while read -r dir; do
          echo "--- Validating $dir ---";
          tofu -chdir="$dir" init -backend=false;
          tofu -chdir="$dir" validate;
          done'
        language: system
        pass_filenames: false
        files: \.tf$
